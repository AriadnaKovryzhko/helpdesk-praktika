databases:
  - name: helpdesk-praktika-db
    plan: free
    region: frankfurt
    postgresMajorVersion: '17'

services:
  - type: web
    name: helpdesk-praktika-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: '3000'
      - key: DATABASE_URL
        fromDatabase:
          name: helpdesk-praktika-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://helpdesk-praktika-app.onrender.com
      - key: APP_URL
        value: https://helpdesk-praktika-app.onrender.com
      - key: COOKIE_SECURE
        value: 'true'
      - key: SEED_ON_START
        value: 'true'
      - key: AUTH_THROTTLE_LIMIT
        value: '100'
      - key: UPLOAD_DIR
        value: /app/uploads

  - type: web
    name: helpdesk-praktika-app
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: PORT
        value: '80'
      - key: BACKEND_SCHEME
        value: https
      - key: BACKEND_UPSTREAM
        value: helpdesk-praktika-api.onrender.com
      - key: BACKEND_HOST_HEADER
        value: helpdesk-praktika-api.onrender.com
